<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#222">Dust tiles: power and sensing</text>

  <!-- wall plate -->
  <rect x="30" y="70" width="430" height="540" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="50" y="98" font-weight="bold" fill="#374151">Wall plate (inside the ring)</text>
  <rect x="50" y="120" width="120" height="50" rx="6" fill="#fff" stroke="#374151"/><text x="62" y="150">USB-C charger</text>
  <rect x="200" y="120" width="120" height="50" rx="6" fill="#fff" stroke="#374151"/><text x="214" y="142">PD trigger</text><text x="232" y="160" fill="#b45309">20 V</text>
  <line x1="170" y1="145" x2="200" y2="145" stroke="#b45309" stroke-width="3"/>
  <rect x="200" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#374151"/><text x="224" y="227">5 A fuse</text>
  <line x1="260" y1="170" x2="260" y2="200" stroke="#b45309" stroke-width="3"/>
  <rect x="200" y="275" width="120" height="56" rx="6" fill="#fff" stroke="#374151"/><text x="212" y="298">Step-down</text><text x="212" y="318" fill="#dc2626">set 5.3 V</text>
  <line x1="260" y1="244" x2="260" y2="275" stroke="#b45309" stroke-width="3"/>
  <text x="340" y="300" font-size="13" fill="#555">+ 1000 µF</text><text x="340" y="317" font-size="13" fill="#555">+ TVS</text>
  <line x1="260" y1="331" x2="260" y2="370" stroke="#dc2626" stroke-width="3"/>
  <line x1="70" y1="370" x2="440" y2="370" stroke="#dc2626" stroke-width="3"/>
  <text x="70" y="362" font-size="13" fill="#dc2626">5.3 V bus</text>
  <g font-size="12">
    <rect x="70" y="395" width="40" height="22" rx="3" fill="#fde68a" stroke="#92400e"/><text x="76" y="410">PTC</text>
    <rect x="130" y="395" width="40" height="22" rx="3" fill="#fde68a" stroke="#92400e"/><text x="136" y="410">PTC</text>
    <rect x="190" y="395" width="40" height="22" rx="3" fill="#fde68a" stroke="#92400e"/><text x="196" y="410">PTC</text>
    <text x="250" y="410" font-size="16">· · ·  ×9</text>
  </g>
  <line x1="90" y1="370" x2="90" y2="395" stroke="#dc2626" stroke-width="2"/><line x1="150" y1="370" x2="150" y2="395" stroke="#dc2626" stroke-width="2"/><line x1="210" y1="370" x2="210" y2="395" stroke="#dc2626" stroke-width="2"/>
  <rect x="60" y="450" width="380" height="140" rx="8" fill="#fff" stroke="#6b7280" stroke-dasharray="5 4"/>
  <text x="76" y="474" font-weight="bold" fill="#374151">Each position (top face)</text>
  <circle cx="130" cy="520" r="9" fill="#9ca3af"/><text x="112" y="550" font-size="13">pin −</text>
  <circle cx="190" cy="520" r="9" fill="#dc2626"/><text x="172" y="550" font-size="13">pin +</text>
  <circle cx="290" cy="500" r="11" fill="#ef4444" stroke="#7f1d1d"/><text x="284" y="505" fill="#fff" font-size="12">N</text>
  <circle cx="290" cy="550" r="11" fill="#ef4444" stroke="#7f1d1d"/><text x="284" y="555" fill="#fff" font-size="12">N</text>
  <text x="312" y="530" font-size="13">holding magnets,</text><text x="312" y="547" font-size="13">north up</text>
  <line x1="90" y1="417" x2="190" y2="511" stroke="#dc2626" stroke-width="2"/>

  <!-- tile -->
  <rect x="520" y="70" width="650" height="540" rx="10" fill="#f8fafc" stroke="#6b7280"/>
  <text x="540" y="98" font-weight="bold" fill="#374151">One tile (sleeve, seen from the screen side)</text>
  <rect x="640" y="150" width="300" height="300" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
  <text x="735" y="305" fill="#1e3a8a">ESP-Mosaico</text>
  <!-- top edge contacts: clockwise = rightwards -->
  <g>
    <rect x="740" y="146" width="12" height="8" fill="#dc2626"/><rect x="770" y="146" width="12" height="8" fill="#9ca3af"/>
    <circle cx="804" cy="150" r="6" fill="#9ca3af" stroke="#111"/><circle cx="834" cy="150" r="6" fill="#dc2626" stroke="#111"/>
    <circle cx="672" cy="150" r="9" fill="#3b82f6"/><text x="667" y="155" fill="#fff" font-size="11">S</text>
    <circle cx="908" cy="150" r="9" fill="#ef4444"/><text x="903" y="155" fill="#fff" font-size="11">N</text>
  </g>
  <path d="M700 125 L880 125" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><text x="745" y="118" font-size="13">clockwise</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
  <text x="726" y="182" font-size="12">pads</text><text x="808" y="182" font-size="12">pins</text>
  <text x="680" y="210" font-size="12" fill="#555">outer pair (±5.4 mm) = +5.3 V</text>
  <text x="680" y="226" font-size="12" fill="#555">inner pair (±1.8 mm) = GND</text>
  <text x="680" y="250" font-size="12" fill="#555">same on all four edges</text>
  <!-- other edges magnets hint -->
  <circle cx="944" cy="182" r="9" fill="#3b82f6"/><circle cx="944" cy="418" r="9" fill="#ef4444"/>
  <circle cx="908" cy="454" r="9" fill="#3b82f6"/><circle cx="672" cy="454" r="9" fill="#ef4444"/>
  <circle cx="636" cy="418" r="9" fill="#3b82f6"/><circle cx="636" cy="182" r="9" fill="#ef4444"/>
  <!-- sensors -->
  <rect x="700" y="330" width="22" height="22" fill="#10b981"/><text x="690" y="370" font-size="12">BMM150 A</text>
  <rect x="860" y="270" width="22" height="22" fill="#10b981"/><text x="846" y="310" font-size="12">BMM150 B</text>
  <!-- diode -->
  <rect x="968" y="270" width="186" height="110" rx="8" fill="#fff" stroke="#374151"/>
  <text x="980" y="294" font-weight="bold">Inside the sleeve</text>
  <text x="980" y="318" font-size="13">bus + → SS34 → 5V pad</text>
  <text x="980" y="338" font-size="13">bus − → GND</text>
  <text x="980" y="358" font-size="13">back pads → bus ±</text>
  <text x="540" y="500" font-size="14">Any edge meets any edge: N lands on S, and each pin lands on a pad of the same net.</text>
  <text x="540" y="524" font-size="14">The magnetometers feel a neighbour's two magnets on each joined edge, and the plate's</text>
  <text x="540" y="548" font-size="14">magnets behind. That's how a tile knows its sides, its slot and when it's lifted.</text>
  <text x="540" y="580" font-size="13" fill="#555">A tile turned to the wall pushes away (N meets N), so it can't short anything.</text>
</svg>
